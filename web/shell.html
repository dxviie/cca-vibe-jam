<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>cca vibe jam</title>
    <style>
        html, body {
            margin: 0;
            height: 100%;
            background: #11111b;
            color: #cdd6f4;
            font-family: system-ui, sans-serif;
        }
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }
        canvas {
            display: block;
            background: #000;
            outline: none;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
        }
        #status { font-size: 14px; min-height: 1.2em; }
    </style>
</head>
<body>
    <canvas id="canvas" width="800" height="450" tabindex="-1" oncontextmenu="event.preventDefault()"></canvas>
    <div id="status">Loading…</div>

    <script>
        var statusEl = document.getElementById('status');
        var canvasEl = document.getElementById('canvas');

        var Module = {
            canvas: canvasEl,
            print: function (text) { console.log(text); },
            printErr: function (text) { console.error(text); },
            setStatus: function (text) { statusEl.textContent = text; },
            onRuntimeInitialized: function () { canvasEl.focus(); }
        };

        canvasEl.addEventListener('webglcontextlost', function (e) {
            statusEl.textContent = 'WebGL context lost, reload the page.';
            e.preventDefault();
        });
        canvasEl.addEventListener('pointerdown', function () { canvasEl.focus(); });

        window.onerror = function () {
            statusEl.textContent = 'Something went wrong, see the browser console.';
        };
    </script>
    {{{ SCRIPT }}}
</body>
</html>
