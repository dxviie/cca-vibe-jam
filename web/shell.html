<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>cca vibe jam</title>
    <style>
        html, body {
            margin: 0;
            height: 100%;
            overflow: hidden;
            background: #1e1e2e;
            color: #cdd6f4;
            font-family: system-ui, sans-serif;
        }
        /* raylib sizes the canvas to the browser window itself, so no CSS width/height here */
        canvas {
            display: block;
            position: fixed;
            top: 0;
            left: 0;
            outline: none;
            touch-action: none;          /* no scrolling or pinch-zoom while playing on touch screens */
            image-rendering: pixelated;  /* keep pixels crisp when high-DPI screens upscale the canvas */
        }
        #status {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <canvas id="canvas" tabindex="-1" oncontextmenu="event.preventDefault()"></canvas>
    <div id="status">Loading…</div>

    <script>
        var statusEl = document.getElementById('status');
        var canvasEl = document.getElementById('canvas');

        var Module = {
            canvas: canvasEl,
            print: function (text) { console.log(text); },
            printErr: function (text) { console.error(text); },
            setStatus: function (text) { statusEl.textContent = text; },
            onRuntimeInitialized: function () { canvasEl.focus(); }
        };

        canvasEl.addEventListener('webglcontextlost', function (e) {
            statusEl.textContent = 'WebGL context lost, reload the page.';
            e.preventDefault();
        });
        canvasEl.addEventListener('pointerdown', function () { canvasEl.focus(); });

        window.onerror = function () {
            statusEl.textContent = 'Something went wrong, see the browser console.';
        };
    </script>
    {{{ SCRIPT }}}
</body>
</html>
